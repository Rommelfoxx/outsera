name: ServeRest QA CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  test-api:
    name: Testes de API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Limpar relatórios anteriores
        run: |
          node <<'NODE'
          const fs = require('fs')

          fs.rmSync('cypress/reports/mocha', {
            recursive: true,
            force: true,
          })

          fs.rmSync('cypress/reports/html', {
            recursive: true,
            force: true,
          })

          fs.mkdirSync('cypress/reports/mocha/.jsons', {
            recursive: true,
          })
          NODE

      - name: Executar testes de API (usuarios)
        run: |
          npx cypress run \
            --browser chrome \
            --headless \
            --spec "cypress/e2e/api/usuarios/**/*.cy.js"

      - name: Mesclar relatórios JSON
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(cypress/reports/mocha/.jsons/*.json)

          if (( ${#reports[@]} > 0 )); then
            npm run report:merge
          else
            echo "Nenhum relatório JSON encontrado para mesclar."
          fi

      - name: Gerar relatório HTML
        if: always()
        shell: bash
        run: |
          if [ -s cypress/reports/mocha/merged.json ]; then
            npm run report:generate
          else
            echo "Relatório mesclado indisponível. HTML não gerado."
          fi

      - name: Upload relatório Mochawesome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-api
          path: cypress/reports/html/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload relatórios JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-json-api
          path: cypress/reports/mocha/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar resumo do relatório no GitHub Actions
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs')

          const reportPath = 'cypress/reports/mocha/merged.json'
          const summaryPath = process.env.GITHUB_STEP_SUMMARY

          if (
            !fs.existsSync(reportPath) ||
            fs.statSync(reportPath).size === 0
          ) {
            fs.appendFileSync(
              summaryPath,
              '## 📊 Mochawesome Test Report\n\n' +
              '⚠️ Relatório indisponível. Confira a execução dos testes e a mesclagem dos JSONs.\n'
            )

            process.exit(0)
          }

          const report = JSON.parse(
            fs.readFileSync(reportPath, 'utf8')
          )

          const {
            tests,
            passes,
            failures,
            pending,
            skipped,
            duration,
          } = report.stats

          const summary = [
            '## 📊 Mochawesome Test Report',
            '',
            `Total: ${tests}`,
            `✅ Aprovados: ${passes}`,
            `❌ Falhas: ${failures}`,
            `⏸ Pendentes: ${pending}`,
            `⏭ Ignorados: ${skipped ?? 0}`,
            `⏱ Duração: ${(duration / 1000).toFixed(1)}s`,
            '',
          ].join('\n')

          fs.appendFileSync(summaryPath, summary)
          NODE

      - name: Upload screenshots (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload vídeos (somente em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: videos-api
          path: cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

  # ─── Testes de UI ─────────────────────────────────────────────────────────────
  test-ui:
    name: Testes de UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Cache binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Verificar versão do Chrome disponível
        run: google-chrome --version

      - name: Executar testes UI — Login
        id: test-login
        continue-on-error: true
        run: npx cypress run --browser chrome --headless --spec "cypress/e2e/ui/SignupLogin/login.feature"

      - name: Executar testes UI — Cadastro
        id: test-signup
        continue-on-error: true
        run: npx cypress run --browser chrome --headless --spec "cypress/e2e/ui/SignupLogin/signUp.feature"

      - name: Executar testes UI — Busca (Home)
        id: test-search
        continue-on-error: true
        run: npx cypress run --browser chrome --headless --spec "cypress/e2e/ui/Home/search.feature"

      - name: Mesclar relatórios JSON
        if: always()
        run: |
          if ls cypress/reports/mocha/.jsons/*.json 1> /dev/null 2>&1; then
            npm run report:merge
          else
            echo "Nenhum relatório JSON encontrado para mesclar."
          fi

      - name: Gerar relatório HTML
        if: always()
        run: |
          if [ -f cypress/reports/mocha/merged.json ]; then
            npm run report:generate
          else
            echo "merged.json não encontrado, pulando geração de HTML."
          fi

      - name: Upload relatório Mochawesome
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-ui
          path: cypress/reports/html/
          retention-days: 7

      - name: Publicar resumo do relatório no GitHub Actions
        if: always()
        run: |
          echo "## 📊 Mochawesome Test Report - UI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f cypress/reports/mocha/merged.json ]; then
            echo "⚠️ Relatório indisponível. Verifique se os testes foram executados." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('cypress/reports/mocha/merged.json'));
          const { passes, failures, pending, duration } = report.stats;
          const total = passes + failures + pending;
          const status = failures === 0 ? '✅ Passed' : '❌ Failed';
          console.log('| Total | ' + total + ' |');
          console.log('| ✅ Passed | ' + passes + ' |');
          console.log('| ❌ Failed | ' + failures + ' |');
          console.log('| ⏱ Duration | ' + (duration / 1000).toFixed(1) + 's |');
          console.log('| Status | ' + status + ' |');
          " >> $GITHUB_STEP_SUMMARY

      - name: Verificar resultado dos testes UI
        if: always()
        run: |
          if [ "${{ steps.test-login.outcome }}" = "failure" ] || [ "${{ steps.test-signup.outcome }}" = "failure" ] || [ "${{ steps.test-search.outcome }}" = "failure" ]; then
            echo "Uma ou mais suítes de teste falharam."
            exit 1
          fi

      - name: Upload screenshots (somente em falha)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-ui
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload vídeos (somente em falha)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos-ui
          path: cypress/videos/
          retention-days: 7

  # ─── Performance Test (Lightweight) ───────────────────────────────────────────
  performance-smoke:
    name: Performance Smoke Test
    runs-on: ubuntu-latest
    needs: [test-api, test-ui]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Criar diretório de relatórios
        run: mkdir -p k6/reports

      - name: Smoke Test K6 (50 usuários por 1 minuto)
        continue-on-error: true
        run: |
          k6 run --vus 50 --duration 1m --out json=k6/reports/smoke-test.json k6/tests/load-test-usuarios.js || true

      - name: Upload relatórios K6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-test
          path: k6/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Resumo do teste
        if: always()
        run: |
          echo "## 🚀 K6 Smoke Test (50 VUs / 1 min)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Smoke test concluído - baseline de performance registrado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Para testes completos, execute localmente:" >> $GITHUB_STEP_SUMMARY
          echo "- Load Test: \`k6 run k6/tests/load-test-usuarios.js\` (500 VUs, 5 min)" >> $GITHUB_STEP_SUMMARY
          echo "- Spike Test: \`k6 run k6/tests/spike-test-usuarios.js\` (1000 VUs)" >> $GITHUB_STEP_SUMMARY
